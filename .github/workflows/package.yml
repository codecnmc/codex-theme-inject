name: 打包并发布 Windows 版本

on:
  push:
    branches:
      - clean-version
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: 构建、压缩并发布
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2

      - name: 读取版本号
        id: version
        shell: pwsh
        run: |
          $manifest = Get-Content Cargo.toml -Raw
          $version = [regex]::Match($manifest, '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          if (-not $version) { throw "Cargo.toml 缺少 package.version" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: 检查版本标签未被占用
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag 已存在，请先提升 Cargo.toml 版本" }
          $global:LASTEXITCODE = 0

      - name: 运行测试
        shell: pwsh
        run: |
          cargo test --locked
          node scripts/check-runtime.mjs

      - name: 构建精简 Release
        run: cargo build --release --locked

      - name: 生成最小发布压缩包
        shell: pwsh
        run: |
          $packageName = "theme-inject-windows-x64-v${{ steps.version.outputs.version }}"
          $themesPackageName = "theme-inject-themes-v${{ steps.version.outputs.version }}"
          $packageDirectory = Join-Path "dist" $packageName
          New-Item -ItemType Directory -Path $packageDirectory -Force | Out-Null
          Copy-Item "target/release/theme-inject.exe" $packageDirectory
          Copy-Item "README.md" $packageDirectory
          Copy-Item "README.en.md" $packageDirectory
          Compress-Archive -Path "$packageDirectory/*" -DestinationPath "dist/$packageName.zip" -CompressionLevel Optimal
          $zip = "dist/$packageName.zip"
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          "$hash  $packageName.zip" | Set-Content -Path "$zip.sha256" -NoNewline -Encoding ascii
          $themeFiles = @(Get-ChildItem "themes" -File -Filter "*.zip")
          if ($themeFiles.Count -eq 0) { throw "themes 目录中没有可发布的主题 ZIP" }
          $themesZip = "dist/$themesPackageName.zip"
          Compress-Archive -LiteralPath $themeFiles.FullName -DestinationPath $themesZip -CompressionLevel Optimal
          $themesHash = (Get-FileHash -Algorithm SHA256 $themesZip).Hash.ToLowerInvariant()
          "$themesHash  $themesPackageName.zip" | Set-Content -Path "$themesZip.sha256" -NoNewline -Encoding ascii
          Get-Item "target/release/theme-inject.exe", $zip, "$zip.sha256", $themesZip, "$themesZip.sha256" | Select-Object Name,Length

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: theme-inject-windows-x64-v${{ steps.version.outputs.version }}
          path: |
            dist/theme-inject-windows-x64-v${{ steps.version.outputs.version }}.zip
            dist/theme-inject-windows-x64-v${{ steps.version.outputs.version }}.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: 上传主题合集
        uses: actions/upload-artifact@v4
        with:
          name: theme-inject-themes-v${{ steps.version.outputs.version }}
          path: |
            dist/theme-inject-themes-v${{ steps.version.outputs.version }}.zip
            dist/theme-inject-themes-v${{ steps.version.outputs.version }}.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Theme Inject v${{ steps.version.outputs.version }}
          files: |
            dist/*.zip
            dist/*.sha256
          generate_release_notes: true
