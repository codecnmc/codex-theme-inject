name: 打包并发布 Windows 版本

on:
  push:
    branches:
      - clean-version
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: 构建、压缩并发布
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2

      - name: 读取版本号
        id: version
        shell: pwsh
        run: |
          $manifest = Get-Content Cargo.toml -Raw
          $version = [regex]::Match($manifest, '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          if (-not $version) { throw "Cargo.toml 缺少 package.version" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: 运行测试
        run: cargo test --locked

      - name: 构建精简 Release
        run: cargo build --release --locked

      - name: 生成最小发布压缩包
        shell: pwsh
        run: |
          $packageName = "theme-inject-windows-x64-v${{ steps.version.outputs.version }}"
          $packageDirectory = Join-Path "dist" $packageName
          New-Item -ItemType Directory -Path $packageDirectory -Force | Out-Null
          Copy-Item "target/release/theme-inject.exe" $packageDirectory
          Copy-Item "README.md" $packageDirectory
          Compress-Archive -Path "$packageDirectory/*" -DestinationPath "dist/$packageName.zip" -CompressionLevel Optimal
          Get-Item "target/release/theme-inject.exe", "dist/$packageName.zip" | Select-Object Name,Length

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: theme-inject-windows-x64-v${{ steps.version.outputs.version }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Theme Inject v${{ steps.version.outputs.version }}
          files: dist/*.zip
          generate_release_notes: true
