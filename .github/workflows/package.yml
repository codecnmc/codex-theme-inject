name: 打包 Windows 版本

on:
  push:
    branches:
      - clean-version
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: 构建并打包
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2

      - name: 运行测试
        run: cargo test --locked

      - name: 构建 Release
        run: cargo build --release --locked

      - name: 生成发布压缩包
        shell: pwsh
        run: |
          $packageName = "theme-inject-windows-x64-${{ github.run_number }}"
          $packageDirectory = Join-Path "dist" $packageName
          New-Item -ItemType Directory -Path $packageDirectory -Force | Out-Null
          Copy-Item "target/release/theme-inject.exe" $packageDirectory
          Copy-Item "README.md" $packageDirectory
          Copy-Item "themes" $packageDirectory -Recurse
          Compress-Archive -Path "$packageDirectory/*" -DestinationPath "dist/$packageName.zip"

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: theme-inject-windows-x64-${{ github.run_number }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
